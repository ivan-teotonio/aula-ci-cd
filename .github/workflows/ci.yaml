# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Mostrar os arquivos do projeto
        run: ls -la

      - name: Verificar se o README existe
        run: test -f README.md

      - name: Mensagem final
        run: echo "Rodando CI"